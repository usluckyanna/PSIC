<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSIC Chat</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>PSIC Chat</h1>
        <p>gpt-5.6-luna <span aria-hidden="true">·</span> Saved in this browser</p>
      </div>
      <button type="button" id="clear" class="secondary">Clear chat</button>
    </header>
    <section id="history" aria-label="Conversation" role="log" tabindex="0"></section>
    <form>
      <label for="message">Message</label>
      <div class="composer">
        <textarea id="message" rows="2" maxlength="3000" required placeholder="Ask anything"></textarea>
        <button id="send" type="submit">Send</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </main>
</body>
</html>
